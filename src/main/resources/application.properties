spring.application.name=pelletstracker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pelletstracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pelletstracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pelletstracker}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:3000}

# Logging to file
logging.file.name=logs/app.log
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

## Bind to 0.0.0.0
server.address=0.0.0.0