spring.application.name=pelletstracker

# Load local .env when present (real env vars, e.g. from docker compose, take precedence)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pelletstracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pelletstracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pelletstracker}
# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
# Existing databases created by Hibernate get baselined at V1, so only later migrations run on them
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:3000}

# Logging to file
logging.file.name=logs/app.log
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

## Bind to 0.0.0.0
server.address=0.0.0.0
# Login sessions (Spring Session JDBC, tables from Flyway V5)
spring.session.jdbc.initialize-schema=never
# Logged out after this long without any request; every request moves it forward
spring.session.timeout=${SESSION_TIMEOUT:30d}
server.servlet.session.cookie.name=pelletstracker_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Behind Cloudflare the app itself only sees http, so this cannot follow the request. Set
# SESSION_COOKIE_SECURE=false for local plain-http use (e.g. Vite via the LAN IP on a phone)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Persistent cookie so the login survives closing the browser; the server-side timeout above decides
server.servlet.session.cookie.max-age=365d
